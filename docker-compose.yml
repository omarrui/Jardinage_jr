services:
  db:
    image: mysql:8.4
    container_name: jardinage_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jardinage_db}
      MYSQL_USER: ${MYSQL_USER:-jardinage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: jardinage_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-jardinage}:${MYSQL_PASSWORD:-password123}@db:3306/${MYSQL_DATABASE:-jardinage_db}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gardening.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password11@}
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FLASK_DEBUG: "1"
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: "5000"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: jardinage_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
