services:
  db:
    image: mysql:8.4
    container_name: jardinage_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jardinage_db}
      MYSQL_USER: ${MYSQL_USER:-jardinage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./node-services
      dockerfile: api-gateway/Dockerfile
    container_name: jardinage_api_gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - appointment-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      APPOINTMENT_SERVICE_URL: http://appointment-service:3002
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PORT: "5000"
    ports:
      - "5000:5000"

  auth-service:
    build:
      context: ./node-services
      dockerfile: auth-service/Dockerfile
    container_name: jardinage_auth_service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-jardinage_db}
      DB_USER: ${MYSQL_USER:-jardinage}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gardening.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password11@}
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      PORT: "3001"

  appointment-service:
    build:
      context: ./node-services
      dockerfile: appointment-service/Dockerfile
    container_name: jardinage_appointment_service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      notification-service:
        condition: service_started
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-jardinage_db}
      DB_USER: ${MYSQL_USER:-jardinage}
      DB_PASSWORD: ${MYSQL_PASSWORD:-password123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gardening.com}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-admin@gardening.com}
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      PORT: "3002"

  notification-service:
    build:
      context: ./node-services
      dockerfile: notification-service/Dockerfile
    container_name: jardinage_notification_service
    restart: unless-stopped
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-}
      PORT: "3003"

  frontend:
    build:
      context: ./frontend
    container_name: jardinage_frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"

volumes:
  mysql_data:
